<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Interactive Flashcard Maker</title>
  <style>
    /* Global Styles */
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: #f9f9f9;
      margin: 0;
      padding: 20px;
      display: flex;
      justify-content: center;
    }

    .container {
      max-width: 900px;
      width: 100%;
    }

    h1 {
      text-align: center;
      color: #333;
      margin-bottom: 20px;
    }

    /* Form Styles */
    .flashcard-form {
      background: #fff;
      padding: 20px;
      border-radius: 8px;
      box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
      margin-bottom: 30px;
    }

    .flashcard-form label {
      display: block;
      margin-bottom: 5px;
      color: #555;
    }

    .flashcard-form textarea {
      width: 100%;
      padding: 10px;
      margin-bottom: 15px;
      border: 1px solid #ddd;
      border-radius: 4px;
      font-size: 16px;
      resize: vertical;
    }

    .flashcard-form button {
      padding: 10px 20px;
      border: none;
      border-radius: 5px;
      background: #28a745;
      color: #fff;
      cursor: pointer;
      font-size: 16px;
      transition: background 0.3s;
    }

    .flashcard-form button:hover {
      background: #218838;
    }

    /* Flashcards Grid */
    .flashcards {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
      gap: 20px;
    }

    /* Flashcard Styles */
    .flashcard {
      perspective: 1000px;
    }

    .flashcard-inner {
      position: relative;
      width: 100%;
      height: 200px;
      text-align: center;
      transition: transform 0.6s;
      transform-style: preserve-3d;
      cursor: pointer;
      border-radius: 8px;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
    }

    .flashcard.flipped .flashcard-inner {
      transform: rotateY(180deg);
    }

    .flashcard-front,
    .flashcard-back {
      position: absolute;
      width: 100%;
      height: 100%;
      backface-visibility: hidden;
      background: #fff;
      border-radius: 8px;
      padding: 20px;
      box-sizing: border-box;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      color: #333;
    }

    .flashcard-back {
      transform: rotateY(180deg);
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Interactive Flashcard Maker</h1>
    <div class="flashcard-form">
      <label for="question">Question:</label>
      <textarea id="question" rows="2" placeholder="Enter your question here..."></textarea>
      <label for="answer">Answer:</label>
      <textarea id="answer" rows="2" placeholder="Enter the answer here..."></textarea>
      <button id="addFlashcard">Add Flashcard</button>
    </div>

    <div class="flashcards" id="flashcards">
      <!-- Flashcards will be appended here -->
    </div>
  </div>

  <script>
    const addFlashcardBtn = document.getElementById('addFlashcard');
    const flashcardsContainer = document.getElementById('flashcards');
    const questionInput = document.getElementById('question');
    const answerInput = document.getElementById('answer');

    addFlashcardBtn.addEventListener('click', () => {
      const question = questionInput.value.trim();
      const answer = answerInput.value.trim();

      if (!question || !answer) {
        alert('Please fill in both the question and the answer.');
        return;
      }

      // Create the flashcard element
      const flashcard = document.createElement('div');
      flashcard.classList.add('flashcard');

      flashcard.innerHTML = `
        <div class="flashcard-inner">
          <div class="flashcard-front">
            ${question}
          </div>
          <div class="flashcard-back">
            ${answer}
          </div>
        </div>
      `;

      // Toggle the flip animation on click
      flashcard.addEventListener('click', () => {
        flashcard.classList.toggle('flipped');
      });

      // Append the new flashcard to the container
      flashcardsContainer.appendChild(flashcard);

      // Clear the input fields
      questionInput.value = '';
      answerInput.value = '';
    });
  </script>
</body>
</html>
